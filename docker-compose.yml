services:
  db:
    image: postgres:16-alpine
    container_name: bkpad_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bkpad_user
      POSTGRES_PASSWORD: bkpad_pass
      POSTGRES_DB: bkpad_inventaris
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkpad_user -d bkpad_inventaris"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bkpad_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://bkpad_user:bkpad_pass@db:5432/bkpad_inventaris
      DATABASE_SSL: "false"
    ports:
      - "4000:4000"
    volumes:
      - ./database:/app/database
      - ./data:/app/data
      - ./backend/src:/app/src

  frontend:
    build: ./frontend
    container_name: bkpad_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data: