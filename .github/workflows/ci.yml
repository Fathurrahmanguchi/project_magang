name: CI/CD - BKPAD Inventaris

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Test Backend (Node + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bkpad_user
          POSTGRES_PASSWORD: bkpad_pass
          POSTGRES_DB: bkpad_inventaris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bkpad_user -d bkpad_inventaris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bkpad_user:bkpad_pass@localhost:5432/bkpad_inventaris
      PORT: 4000

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependency backend
        working-directory: backend
        run: npm install

      - name: Install dependency root (untuk seed script)
        run: npm install --no-save dotenv csv-parse pg

      - name: Jalankan migrasi schema
        run: psql "$DATABASE_URL" -f database/schema.sql

      - name: Seed data kode barang
        run: node database/seed.js

      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present

      - name: Jalankan test backend
        working-directory: backend
        run: npm test

  frontend-build:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependency frontend
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Build image backend
        run: docker build -t bkpad-inventaris-backend:${{ github.sha }} ./backend

      - name: Build image frontend
        run: docker build -t bkpad-inventaris-frontend:${{ github.sha }} ./frontend

      # Tahap deploy (push ke registry, deploy ke server, dll.)
      # sengaja belum diisi -- tinggal ditambahkan saat sudah siap deploy.
      # Contoh langkah lanjutan:
      # - Login ke registry (docker/login-action)
      # - Push image (docker push)
      # - SSH ke server / trigger deployment (appleboy/ssh-action, dsb.)
